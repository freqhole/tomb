[package]
name = "cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "rathole"
path = "src/main.rs"

[lib]
name = "cli"
path = "src/lib.rs"

[features]
# `grimoire/augur` (lan discovery over mdns/dns-sd) is always compiled in,
# not its own toggle feature here - whether it actually runs is a runtime
# `[federation].lan_discovery` config choice, not a build-time one.
default = ["server/webauthn", "grimoire/augur"]
webauthn = ["server/webauthn"]
# opt-in: links libmpv in-process via grimoire's `libmpv-playback`
# feature (only the `player-smoke-test` debug subcommand needs it). off by
# default so the shipped rathole binary has no libmpv.so link-time/runtime
# dependency - rathole shells out to the `mpv` binary for audio + video.
libmpv-playback = ["grimoire/libmpv-playback"]

[dependencies]
grimoire = { path = "../grimoire", default-features = false }
server = { path = "../server", default-features = false }
rathole = { path = "../client/rathole" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
time = { version = "0.3", features = [
    "serde",
    "macros",
    "formatting",
    "parsing",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = "0.11"

[dev-dependencies]
tempfile = "3"

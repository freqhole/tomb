[package]
name = "haruspex"
version.workspace = true
edition.workspace = true
description = "auth domain for the freqhole family: identity, devices, roles/groups, acl, webauthn, knock + friendz protocols"
repository = "https://github.com/freqhole/haruspex"

[lib]
name = "haruspex"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# in-process fixtures + fake stores for consumer test suites, exported under
# haruspex::testing. no functional code yet (phase 0 skeleton).
test-utils = []

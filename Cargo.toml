[workspace]
members = [
    "grimoire",
    "cli",
    "server",
    "client-codegen",
    "client/charnel/src-tauri",
    "client/rathole",
    "lib/haruspex/rust",
    "lib/reliquary/rust",
]
exclude = [
    "lib/midden", # WASM package, built separately with wasm-pack
    # vendored fork of swarm-discovery (see its own Cargo.toml for why) -
    # has its own independent version/edition/Cargo.lock, not meant to
    # participate in this workspace's own lint/feature unification; only
    # ever consumed via the [patch.crates-io] entry below.
    "lib/swarm-discovery-fork",
]
resolver = "2"

[workspace.package]
version = "0.3.18"
edition = "2021"

# TEMPORARY (2026-10-17): vendored fork of swarm-discovery 0.6.4 adding a
# missing PTR answer record to its mdns announce response - without it,
# OS-level Bonjour/mDNS-SD browse apis that strictly follow RFC 6763
# (apple's NWBrowser on macOS/iOS, android's NsdManager) can never
# enumerate ANY peer announced by this crate, even though its own
# receiver (used by this workspace's own desktop augur backend, see
# lib/haruspex/rust/src/augur/desktop.rs) matches SRV/TXT records
# directly and so discovers these same peers just fine - confirmed via a
# real packet capture + direct reading of swarm-discovery's own
# `make_response()` (lib/swarm-discovery-fork/src/sender.rs), not
# guessed. upstream pr pending (not yet opened) at
# https://github.com/rkuhn/swarm-discovery - remove this patch (and the
# vendored lib/swarm-discovery-fork directory + the exclude entry above)
# once a release containing the fix is published and bumped in
# lib/haruspex/rust/Cargo.toml's own transitive dependency tree.
[patch.crates-io]
swarm-discovery = { path = "lib/swarm-discovery-fork" }

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
futures-util = "0.3"
time = { version = "0.3", features = [
    "serde",
    "macros",
    "formatting",
    "parsing",
] }
clap = { version = "4.4", features = ["derive", "env"] }
config = "0.14"
dotenvy = "0.15"
num-traits = "0.2"
rand = "0.8"
regex = "1.0"
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "uuid",
    "time",
    "json",
    "migrate",
] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
shell-words = "1.1"
mime_guess = "2.0"
httpdate = "1.0"
tower-http = { version = "0.6", features = [
    "fs",
    "compression-gzip",
    "compression-br",
    "set-header",
    "trace",
    "cors",
] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2.4"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
openssl = { version = "0.10", features = ["vendored"] }
webauthn-rs = { version = "0.5.1", features = [
    "danger-allow-state-serialisation",
    "conditional-ui",
] }
reqwest = { version = "0.12", features = [
    "json",
    "rustls-tls",
    "multipart",
    "stream",
], default-features = false }
testcontainers = "0.20"
testcontainers-modules = { version = "0.8", features = ["postgres"] }
tempfile = "3.0"
serde_with = "3.0"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.21"
hex = "0.4"
lofty = "0.18"
walkdir = "2.4"
inquire = "0.7"
bigdecimal = { version = "0.4", features = ["serde"] }
image = "0.24"
iroh = "1.3.0"
iroh-blobs = "0.103.1"
irpc = "0.17"
blake3 = "1.5"
getrandom = "0.2"

# release profile optimizations for smaller binaries
[profile.release]
lto = "thin"      # faster than "fat" LTO, still good size reduction
strip = "symbols" # strip debug symbols
# panic = "abort" removed 2026-10-03: this made ANY panic on ANY thread
# (including isolated background worker threads like iroh-blobs' own
# blob-store pool, processing untrusted user-uploaded images) immediately
# abort the entire process with zero recoverability - confirmed for real
# via a crash while viewing an album with a broken Android-camera-sourced
# image. with the default unwind, a panic in a plain spawned thread only
# kills that thread; the rest of the app (GUI included) keeps running.
codegen-units = 1 # better optimization, slower compile
opt-level = "z"   # optimize for size (use "3" if perf is more important)

# real, active flatpak manifest, built via `flatpak-builder` (see
# build-flatpak.sh) - this file used to be dormant/unused (a previous
# comment here said so); that's no longer true as of 2026-09-29.
#
# libmpv (the "experimental player" backend - see
# docs/libmpv-experimental-player-plan.md) is built from source here,
# not bundled from Fedora's system `mpv-libs` package. that package is
# built with every optional feature enabled (samba, kerberos, LDAP, X11,
# OpenGL, JACK, Python...) for general desktop use, and naively bundling
# its full runtime dependency closure duplicated libraries this flatpak
# runtime already provides (glib, gtk, X11, the TLS stack), causing a
# real crash: `libsecret-1.so.0: undefined symbol:
# g_variant_builder_init_static` (the bundled glib didn't match the one
# libsecret - itself part of org.gnome.Platform - was built against).
#
# building from source instead avoids this by construction: a vanilla
# mpv/ffmpeg build doesn't request samba/kerberos/X11/JACK/python unless
# you explicitly ask for them, so none of that dependency class appears
# at all. adapted directly (2026-09-29) from flathub's own
# io.github.celluloid_player.Celluloid manifest - a GTK app built on
# libmpv, on this exact org.gnome.Platform runtime, that already solves
# this exact problem in production. dropped celluloid's own JS scripting
# (mujs) and yt-dlp modules - freqhole doesn't run mpv JS scripts or
# yt-dlp. lua IS kept (as luajit, inlined below, not via celluloid's own
# lua5.1 shared-modules submodule) - mpv's built-in OSC (on-screen
# controls) is itself a bundled lua script, so `-Dlua=disabled` silently
# breaks OSC with `MPV_ERROR_OPTION_NOT_FOUND` on the `osc` option rather
# than failing to build - confirmed 2026-10-03 via a raw ctypes
# mpv_initialize() call against the already-built flatpak's libmpv.so.2.
id: net.freqhole.freqhole
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: freqhole

finish-args:
  # display access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # GPU acceleration for WebKit + libmpv's own gpu vo
  - --device=dri
  # audio playback
  - --socket=pulseaudio
  # MPRIS media controls
  - --own-name=org.mpris.MediaPlayer2.freqhole
  # tauri's GApplication id (see tauri.conf.json's "identifier") differs
  # from this flatpak's own app id above - gtk_init's app.register() tries
  # to own it on the session bus for single-instance activation, which the
  # sandbox's dbus-proxy blocked (unauthorized own-name attempt) as
  # ServiceUnknown, crashing gtk init outright ("Failed to initialize gtk
  # backend!")
  - --own-name=net.freqhole.charnel
  # network access (for connecting to remotes)
  - --share=network
  # file access for music directories
  - --filesystem=xdg-music:ro
  - --filesystem=home:ro
  # removable storage sync targets (udisks/gvfs mount points) - needs rw to
  # copy music onto the drive
  - --filesystem=/run/media
  - --filesystem=/media
  # eject/unmount runs udisksctl or gio on the host via flatpak-spawn, since
  # neither ships in the runtime. remove this and eject degrades to a
  # "unmount from your file manager" message.
  - --talk-name=org.freedesktop.Flatpak
  # dconf access (for GTK settings)
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  # gtk tries to dbus-activate the accessibility bus (org.a11y.Bus) during
  # gtk_init - not covered by any --talk-name above, so the sandbox's
  # filtered dbus proxy reports it as ServiceUnknown, which crashes gtk
  # init outright on some hosts ("Failed to initialize gtk backend!").
  # this skips that connection attempt entirely rather than granting a11y
  # bus access just to silence it.
  - --env=NO_AT_BRIDGE=1
  # system tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # portal access
  - --talk-name=org.freedesktop.portal.*
  # secret service for credentials
  - --talk-name=org.freedesktop.secrets
  # persist app data
  - --persist=.local/share/net.freqhole.charnel

modules:
  # libmpv, built from source - see the file-level comment above for why.
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/applications
      - /share/bash-completion
      - /share/doc
      - /share/icons
      - /share/man
      - /share/zsh
    buildsystem: meson
    config-opts:
      # libmpv.so is what freqhole links against - no need for the `mpv`
      # cli binary itself.
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      # required for mpv's built-in OSC (on-screen controls), which is
      # itself implemented as a bundled lua script - see luajit module below.
      - -Dlua=enabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

    modules:
      # luajit instead of vanilla lua 5.1 - mpv treats luajit as a drop-in,
      # lua5.1-API-compatible scripting backend (most distros actually
      # build mpv against luajit by default, not vanilla lua, for exactly
      # this reason) and its own build system already produces a proper
      # shared lib + pkgconfig file, unlike lua 5.1's upstream Makefile
      # (which only ever makes a static lib + cli binary, needing hand-
      # patched Makefile targets to get a .so at all). recipe matches
      # flathub's own shared-modules/luajit/luajit.json (fetched
      # 2026-10-03) - openresty's actively-maintained luajit2 fork, since
      # upstream luajit.org is no longer maintained.
      - name: luajit
        no-autogen: true
        make-args:
          - BUILDMODE=dynamic
          - PREFIX=${FLATPAK_DEST}
        make-install-args:
          - PREFIX=${FLATPAK_DEST}
        sources:
          - type: git
            url: https://github.com/openresty/luajit2.git
            tag: v2.1-20260724
            commit: 982cd8323eafd8604a9e5f2a916aa50b9f67d9ed
        cleanup:
          - /bin
          - /include
          - /lib/pkgconfig
          - /share/man

      - name: libopenmpt
        config-opts:
          - --disable-static
          - --disable-tests
          - --disable-examples
          - --disable-openmpt123
          - --disable-doxygen-doc
          - --without-portaudio
        cleanup:
          - /include
          - /lib/pkgconfig
          - /lib/*.la
          - /share/doc
        sources:
          - type: archive
            url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.autotools.tar.gz
            sha256: d7ce84fd05d686c4bcf66af40eae857afa371442db60eeda3f874bd6cf6fc318

      - name: ffmpeg
        cleanup:
          - /include
          - /lib/pkgconfig
          - /share/ffmpeg/examples
        config-opts:
          - --enable-shared
          - --disable-static
          - --enable-gnutls
          - --enable-gpl
          - --disable-doc
          - --disable-programs
          - --disable-encoders
          - --disable-muxers
          - --enable-encoder=png
          - --enable-encoder=libjxl
          - --enable-libv4l2
          - --enable-libdav1d
          - --enable-libjxl
          - --enable-libopenmpt
        sources:
          - type: archive
            url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
            sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
            sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

      - name: uchardet
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DBUILD_STATIC=0
          - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cleanup:
          - /bin
          - /include
          - /lib/pkgconfig
          - /share/man
          - /lib/cmake
        sources:
          - type: archive
            url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
            sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

      - name: rubberband
        buildsystem: meson
        config-opts:
          - -Ddefault_library=shared
        cleanup:
          - /bin
          - /include
          - /lib/pkgconfig
          - /lib/ladspa
        sources:
          - type: archive
            url: https://breakfastquay.com/files/releases/rubberband-4.0.0.tar.bz2
            sha256: af050313ee63bc18b35b2e064e5dce05b276aaf6d1aa2b8a82ced1fe2f8028e9

      - name: libplacebo
        buildsystem: meson
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: git
            url: https://github.com/haasn/libplacebo.git
            tag: v7.360.1
            commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  # freqhole's own already-built binary/desktop-file/icons, extracted
  # from the .deb produced by `make build-tauri-linux-intel`/`-arm64`
  # (Dockerfile.tauri) - see install-freqhole.sh. does not rebuild the
  # app itself, only libmpv above is actually compiled here.
  - name: freqhole
    buildsystem: simple
    build-commands:
      - chmod +x install-freqhole.sh
      - ./install-freqhole.sh
    sources:
      - type: file
        path: freqhole.deb
      - type: file
        path: net.freqhole.freqhole.metainfo.xml
      - type: file
        path: install-freqhole.sh

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>freqhole</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .logo.errored {
        animation: none;
        opacity: 1;
        transform: none;
      }
      #status {
        font-size: 14px;
        color: #aaa;
        max-width: 320px;
        line-height: 1.5;
      }
      #status.errored {
        color: #f28b82;
      }
    </style>
  </head>
  <body>
    <svg id="logo" class="logo" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M250 405L125 155L375 155L303.611 340.714L250 405Z" fill="#FF00FF" />
    </svg>
    <div id="status">setting up your library&hellip;</div>
    <script>
      // called from the rust side (via a webview `.eval()` call, see
      // `mobile_finish_boot` in client/charnel/src-tauri/src/lib.rs) if
      // first-run setup fails - on success, rust navigates this window
      // away from loading.html entirely instead of calling this.
      window.freqholeSetupFailed = function (message) {
        document.getElementById("logo").classList.add("errored");
        var status = document.getElementById("status");
        status.classList.add("errored");
        status.textContent = "setup failed: " + message;
      };
    </script>
  </body>
</html>

[package]
name = "charnel"
version.workspace = true
description = "freqhole desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "charnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# libmpv spike only (examples/libmpv_probe.rs, libmpv_window_probe.rs) - same
# tao version tauri-runtime-wry 2.10.1 pulls in, so it pumps the exact same
# native event loop charnel's real process runs, without needing a full
# tauri/wry build for the spike. see docs/libmpv-experimental-player-plan.md.
tao = "=0.34.8"

[dependencies]
tauri = { version = "=2.10.3", features = ["macos-private-api",
    "protocol-asset",
    "tray-icon",
    "devtools",
] }
# pinned exactly alongside tauri (not otherwise used directly) so tao stays on
# 0.34.8 -- tauri-runtime-wry 2.11.x pulls in tao 0.35.x, which regressed
# ndk-context init on android (never calls initialize_android_context()) and
# aborts real devices with "android context was not initialized" the moment
# any android-context-dependent networking (iroh's netwatch, rustls
# platform-verifier) runs. same fix as skein's tauri/Cargo.toml.
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "net", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
urlencoding = "2"
chrono = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
lofty = { workspace = true }
shell-words = { workspace = true }
# for the custom `freqhole-media://` uri scheme protocol (media_protocol.rs) -
# already transitively present (tauri's own built-in asset protocol uses the
# same crates), pinned here as direct deps so cargo resolves to the same
# already-present versions rather than adding duplicates.
http-range = "0.1"
percent-encoding = "2"
mime_guess = "2"

# internal dependencies
grimoire = { path = "../../../grimoire", default-features = false }
server = { path = "../../../server", default-features = false }
async-trait = "0.1"
iroh = { workspace = true }
tauri-plugin-android-media-session = { path = "plugins/tauri-plugin-android-media-session" }

# desktop-only: the cli library exposes the full `rathole` subcommand
# surface as a callable function. when the tauri binary is launched
# from a terminal with any args (`freqhole users list`, `freqhole
# rathole`, etc.) we hand off to `cli::run()` and exit, instead of
# starting the GUI. mobile targets never see argv beyond the
# launcher path so we skip this dep there.
[target."cfg(any(target_os = \"macos\", target_os = \"linux\", target_os = \"windows\"))".dependencies.cli]
path = "../../../cli"
default-features = false
features = ["libmpv-playback"]

[target."cfg(unix)".dependencies]
nix = { version = "0.29", features = ["signal", "fs"] }

# libmpv playback is desktop-only — android can technically use it too
# but we don't want the extra build cost there yet, and the existing html
# audio path keeps working.
[target."cfg(any(target_os = \"macos\", target_os = \"linux\", target_os = \"windows\"))".dependencies]
grimoire = { path = "../../../grimoire", default-features = false, features = [
    "webauthn",
    "vendored-openssl",
    "libmpv-playback",
] }

libmpv2 = "6"
# OS media session / now-playing controls (MPRIS on linux via zbus, SMTC on
# windows, MPNowPlayingInfoCenter on macOS) for the libmpv audio + video
# paths, which don't get a `navigator.mediaSession` for free the way the
# webview's own `<audio>`/`<video>` elements do. only constructed when
# `use_libmpv_playback` is on - see `media_session.rs`.
playwire = "1.0.0"

# android only: wry's android WebViewClient.handleRequest builds a reqwest
# client that uses rustls 0.23, which panics ("No provider set") if no
# default CryptoProvider is installed. we install ring at app startup.
# desktop targets keep using their existing tls stacks unchanged.
[target."cfg(target_os = \"android\")".dependencies]
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
objc2-core-foundation = "0.3.2"
objc2-disk-arbitration = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
udev = "0.9.3"

# libmpv-2.dll is bundled via `bundle.resources` (see tauri.conf.json) since
# mpv-libre-runtime's windows archive ships no import lib we can bake an
# absolute path into at link time - registering $RESOURCE as a DLL search
# directory at startup (src/lib.rs) is what actually finds it at runtime.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

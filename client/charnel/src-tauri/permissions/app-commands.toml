# grants access to charnel's own (non-plugin) commands - see src/lib.rs's
# `invoke_handler(tauri::generate_handler![...])` list, which is the single
# source of truth this file mirrors.
#
# by default tauri allows all app-registered commands for LOCAL origins with
# no acl needed at all (see https://v2.tauri.app/security/capabilities/#configuration-files).
# but the setup-wizard window loads an external dev url (http://localhost:1421,
# set in wizard.rs/lib.rs/server_controls.rs/menu.rs - vite's dedicated wizard
# dev server, distinct from spume's devUrl of 1420 in tauri.conf.json) rather
# than tauri's configured `devUrl`, so in dev builds only, tauri classifies it
# as a "remote" origin - which gets zero default command access and instead
# needs an explicit permission grant referenced from a capability's "remote"
# block (see capabilities/default.json, which already matches
# http://localhost:* - this just supplies the missing permission for our own
# commands under that existing remote match). production builds are
# unaffected: the wizard there loads from bundled assets via tauri's local
# protocol, which is always local and bypasses acl for app commands entirely.
[[permission]]
identifier = "allow-app-commands"
description = "allow the app's own commands to be invoked from any window/webview covered by a capability referencing this permission."
commands.allow = [
    "check_setup_status",
    "check_dependencies",
    "get_setup_defaults",
    "run_setup_core",
    "create_admin_user",
    "get_default_data_dir",
    "resolve_path",
    "get_os_username",
    "get_app_version",
    "get_build_info",
    "take_pending_deep_links",
    "get_config_path",
    "get_data_dir",
    "is_flatpak",
    "check_dir_writable",
    "get_fetch_music_dir",
    "update_fetch_music_dir",
    "get_freqhole_config",
    "get_client_config",
    "open_config_dir",
    "save_zip_to_downloads",
    "open_path_in_folder",
    "zip_create",
    "zip_append_file",
    "zip_finish",
    "zip_abort",
    "scan_directory",
    "rescan_directories",
    "get_federation_status",
    "federation_setup",
    "federation_sync",
    "federation_logout",
    "toggle_federation_enabled",
    "reload_config",
    "get_sync_queue_to_local",
    "set_sync_queue_to_local",
    "get_chromeless_title_bar",
    "set_chromeless_title_bar",
    "supports_chromeless_title_bar",
    "get_rodio_playback",
    "set_rodio_playback",

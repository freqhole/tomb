[package]
name = "rathole"
version.workspace = true
edition = "2021"
description = "ratatui-based client for freqhole (terminal + browser)"

# wasm-pack invokes `wasm-opt` after rustc. its bundled wasm-opt
# is too old for the bulk-memory ops modern rustc emits, so the
# Makefile prepends `/opt/homebrew/bin` (brew's binaryen) to PATH
# before invoking wasm-pack. nothing to disable here.

# ----------------------------------------------------------------------
# deps shared by both shells (ratcore). nothing here may pull
# crossterm, tokio runtime, grimoire, or any other shell-only crate.
# ----------------------------------------------------------------------
[dependencies]
ratatui = { version = "0.30", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# pin generation for the `--player`/`/player` pairing protocol
# (ratcore/app/pairing.rs) - pure computation, portable to both shells.
rand = { workspace = true }
tui-big-text = "0.8"

# ----------------------------------------------------------------------
# tty shell deps (anything that's NOT wasm32). cargo unifies these
# with the base [dependencies] block when building for the host.
# ----------------------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { workspace = true }
futures = "0.3"
toml = "0.8"
ulid = "1"
color-eyre = "0.6"
tracing-subscriber = { workspace = true }
grimoire = { path = "../../grimoire", default-features = false, features = [
    "rodio-playback",
] }
anyhow = { workspace = true }
libc = "0.2"
# clipboard + browser-open helpers for /info-style slash commands
# (e.g. copy or open the spume invite link). both are tty-shell only.
arboard = { version = "3", default-features = false }
open = "5"
base64 = { workspace = true }
# qr code rendering for the `--player`/`/player` pairing screen (see
# docs/rathole-headless-player-plan.md). `image` feature adds
# `qrcode::render::image` (renders straight to an `image::ImageBuffer`),
# used by the "framebuffer" display mode to build a qr+pin png shown
# via mpv; the default "terminal" mode still uses the crate's own
# unicode half-block renderer, unaffected by this feature.
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# rasterized now-playing art + qr, terminal mode: halfblocks rendering
# (works in any terminal, no protocol detection) - see the plan doc's
# "image rendering modes" section. no-default-features + explicit
# feature list avoids pulling in libchafa (a C library, would be a
# cross-compile yak-shave for the pi32 target).
ratatui-image = { version = "11", default-features = false, features = [
    "image-defaults",
    "crossterm",
] }
# compositing the qr+pin framebuffer png (drawing the pin digits onto
# the rendered qr) - ratatui-image/qrcode's `image` feature already pull
# this crate in transitively, but rathole's own code needs it as a
# direct dependency to name its types (`image::Rgb`, `RgbImage`, ...).
# default-features off + `png` only: we never decode arbitrary source
# formats here, just build + encode a png.
image = { version = "0.25", default-features = false, features = ["png"] }
# native iroh endpoint for the `--player`/`/player` pairing ALPN
# (tty/pairing.rs) - same version grimoire itself pins, so the
# `iroh::protocol::ProtocolHandler`/`Connection`/etc. types registered
# on grimoire's `FederationEndpoint` router are the same types here.
iroh = { workspace = true }

# ----------------------------------------------------------------------
# web shell deps (wasm32 only). ratzilla brings its own ratatui
# backend; we stay default-features = false on the base ratatui to
# keep crossterm out.
#
# pinned to git main (not crates.io 0.3.0) because main has the
# hidpi/dpr fix for webgl2 — beamterm now sizes the buffer as
# `logical * devicePixelRatio` so retina renders crisply. 0.3.0
# sets `canvas.width = client_width` (css px) and looks blurry on
# any hidpi display. revisit pinning to a release once 0.4 ships.
#
# midden is the iroh-based wasm p2p client (sibling crate in this
# workspace). crate-type = ["cdylib", "rlib"] so we can link it
# directly and call its async methods — no js glue required.
# ----------------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = { git = "https://github.com/ratatui/ratzilla", branch = "main" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
midden = { path = "../../lib/midden" }
js-sys = "0.3"
base64 = { workspace = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "EventTarget",
    "Event",
    "KeyboardEvent",
    "ClipboardEvent",
    "DataTransfer",
    "Location",
    "UrlSearchParams",
    "console",
    "Crypto",
    "HtmlAudioElement",
    "Url",
    "Blob",
    "BlobPropertyBag",
] }
futures = "0.3"
# IndexedDB wrapper. schema/path matches spume's `freqhole_app` /
# `app_state` store with key `p2p_identity` so that when rathole is
# served from the same origin as spume they share the iroh keypair
# transparently.
idb = "0.6"

[[bin]]
name = "rathole"
path = "src/bin/rathole.rs"
required-features = []

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

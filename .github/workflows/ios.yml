# builds + signs the iOS app and (optionally) uploads it to TestFlight.
#
# deliberately a standalone workflow, not a job folded straight into
# release.yml (unlike every other platform) - ios ci is the newest, least-
# proven platform here (see docs/ios.md phase 5/6), so this needs to be
# runnable on its own, repeatedly, via the Actions tab while ironing out
# signing/export issues, without touching (or waiting on) every other
# platform's build each time.
#
# once this is solid, release.yml's `create-release` job *fire-and-forget*
# dispatches this via `gh workflow run` (not a reusable-workflow `uses:`
# call) specifically so an ios failure can never affect the main release
# run's own pass/fail status - GitHub Actions doesn't allow
# `continue-on-error` on a job that calls a reusable workflow, and a
# fully separate, independently-tracked run is a better fit for "modular"
# here anyway: it shows up as its own entry in the Actions tab with its
# own status, exactly like a manual `workflow_dispatch` run would.
#
# unlike android's release job, there's no self-healing "ephemeral
# signing" fallback for forks without secrets: ios genuinely requires a
# pre-registered Apple Distribution certificate + App Store Connect
# provisioning profile (Apple's backend, not something this workflow can
# conjure up itself) - a fork/run missing these secrets gets a clear,
# early, actionable failure instead of a silently-unsigned or skipped
# build. see docs/ios.md phase 5 for how to generate them.
name: ios (build + testflight)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to build, e.g. 0.1.29 (defaults to root package.json)"
        required: false
        type: string
      tag:
        description: "draft github release tag to upload the .ipa to (empty: artifact-only, no release upload) - set automatically when release.yml dispatches this"
        required: false
        type: string
      upload_to_testflight:
        description: "also upload the signed .ipa to TestFlight (leave off while just ironing out the build/signing steps - every upload consumes a build number and can't be undone)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ inputs.version || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ios arm64 (ipa + testflight)
    # a dedicated variable, not the shared `MACOS_ARM64_RUNNER` the
    # desktop mac jobs use (release.yml) - ios genuinely needs a newer
    # Xcode than those jobs do (see the "select newest xcode" step below),
    # so pinning this independently avoids forcing the desktop jobs onto a
    # newer/different runner image just to satisfy ios's requirement.
    # `macos-15` is the current github-hosted image confirmed (via its own
    # runner-images docs) to carry Xcode 26.x side-by-side with older
    # versions - `macos-14` tops out at 16.2, too old to even open a
    # project file saved by a current local Xcode.
    runs-on: ${{ vars.MACOS_IOS_RUNNER || 'macos-15' }}
    env:
      DATABASE_URL: sqlite:data/grimoire.db
      # APPLE_TEAM_ID (not APPLE_DEVELOPMENT_TEAM) matches the Makefile's
      # own expected name - `make build-tauri-ios` already re-exports it as
      # APPLE_DEVELOPMENT_TEAM internally (same mapping local dev builds
      # use, see the Makefile's own comment on that target).
      #
      # IOS_CERTIFICATE/IOS_CERTIFICATE_PASSWORD/IOS_MOBILE_PROVISION ARE
      # tauri-cli's own names though (not ours) - it reads them directly
      # (`mobile::ios::signing_from_env`/`project_config`) and handles the
      # entire keychain-import/profile-install/pbxproj-signing patch
      # itself from just these values, so (unlike the android/macOS jobs)
      # there's no manual `security create-keychain`/`security import`/
      # profile-copy dance needed here at all.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      # the committed project.pbxproj tracks whatever Xcode last
      # regenerated it locally (currently 26.3 - see docs/ios.md) - its
      # project-FILE-FORMAT version is independent of IPHONEOS_DEPLOYMENT_
      # TARGET (project.yml's own `deploymentTarget: iOS: 15.0`, untouched
      # by this): an old deployment target and a new Xcode aren't in
      # tension, but an old Xcode flatly can't even PARSE a project file
      # saved by a newer one ("future Xcode project file format" error).
      # select whichever installed Xcode is newest rather than hardcoding
      # a version, so this keeps matching local dev as both sides
      # naturally move forward over time.
      - name: select newest installed xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::no /Applications/Xcode_*.app found on this runner"
            exit 1
          fi
          echo "selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: resolve version
        id: meta
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V="$(node -p "require('./package.json').version")"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: require ios signing secrets
        if: env.IOS_CERTIFICATE == '' || env.APPLE_TEAM_ID == ''
        run: |
          echo "::error::missing one or more of APPLE_TEAM_ID/IOS_CERTIFICATE_P12_BASE64/IOS_CERTIFICATE_PASSWORD/IOS_PROVISIONING_PROFILE_BASE64 secrets - see docs/ios.md phase 5 for how to generate an Apple Distribution certificate + App Store provisioning profile. there's no ephemeral-signing fallback for ios (unlike android's job) - a real distribution cert/profile is a hard requirement for a TestFlight-ready build."
          exit 1

      # tauri-cli's own `ios build` unconditionally checks for an installed
      # iOS *simulator* runtime - confirmed by reading its actual source
      # (`ensure_ios_runtime_installed` in tauri-cli's mobile/ios/mod.rs) -
      # even though this workflow only ever builds for a real device/
      # archive target, never the simulator. if none is found, it falls
      # back to an INTERACTIVE confirm prompt (dialoguer) with no ci/CI-env
      # escape hatch of its own; on a non-interactive runner that prompt
      # can't be answered, silently resolves to "no", and the whole build
      # hard-fails with an opaque "iOS platform not installed" error that
      # has nothing to do with signing. runner images are very likely to
      # already ship with one, but this makes it certain rather than
      # hoping, and is nearly free when one's already present.
      - name: ensure an ios simulator runtime is installed
        run: |
          if xcrun simctl list runtimes | grep -q "iOS"; then
            echo "an iOS simulator runtime is already installed, nothing to do"
          else
            echo "no iOS simulator runtime found - installing the latest one"
            xcodebuild -downloadPlatform iOS
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,rustls --locked
      - name: set up database
        run: make db-migrate
      - name: install charnel + spume deps
        run: |
          (cd client-codegen/freqhole-api-client && npm ci)
          (cd client/spume && npm ci)
          (cd client/charnel && npm ci)
      # spume depends on @freqhole/haruspex + @freqhole/reliquary via `file:`
      # links; neither ships dist/ in git, so this must run before charnel's
      # tauri `beforeBuildCommand` builds spume below, or it fails resolving
      # their subpath exports (e.g. "@freqhole/haruspex/flows") - mirrors
      # the android job exactly, same underlying frontend build.
      - name: build haruspex + reliquary libs
        run: make build-libs
      # no explicit spume build here: charnel's tauri `beforeBuildCommand`
      # builds spume (in charnel mode, VITE_CHARNEL_MODE=true) into
      # spume/dist, tauri's frontendDist - mirrors `make build-tauri-android`/
      # `make build-tauri-ios`'s local (dev-signed) usage exactly.
      # VERSION isn't overridden here - matches every other platform job in
      # release.yml, which all trust the checked-out Cargo.toml's own
      # version (what `make`'s own `VERSION :=` derives) rather than
      # passing one in; `steps.meta.outputs.version` (derived from
      # package.json, same as release.yml's own `create-release` job) is
      # only used below to locate/label the already-built output file.
      - name: build + sign ipa (app-store-connect export)
        run: |
          make build-tauri-ios \
            IOS_EXPORT_METHOD=app-store-connect \
            IOS_BUILD_NUMBER=${{ github.run_number }}
      - name: upload ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: freqhole_charnel_${{ steps.meta.outputs.version }}_ios.ipa
          path: build/${{ steps.meta.outputs.version }}/freqhole_charnel_${{ steps.meta.outputs.version }}_ios.ipa
      - name: upload ipa to draft release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "build/${{ steps.meta.outputs.version }}/freqhole_charnel_${{ steps.meta.outputs.version }}_ios.ipa" \
            --clobber
      # xcrun altool is apple's long-standing CLI for this - still
      # functional as of this writing, though apple's own messaging is
      # steering toward the newer Transporter CLI (`xcrun iTMSTransporter`)
      # for new integrations. start here (simplest, best-documented
      # invocation); swap to Transporter if this step starts failing on a
      # future runner image's Xcode version - exactly the kind of thing
      # this workflow's standalone `workflow_dispatch` trigger exists to
      # let you iterate on without touching the full release pipeline.
      - name: upload to testflight
        if: inputs.upload_to_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "::error::upload_to_testflight was requested but ASC_KEY_ID/ASC_ISSUER_ID/ASC_API_KEY_P8_BASE64 secrets aren't set - see docs/ios.md phase 6 for how to generate an App Store Connect API key."
            exit 1
          fi
          # altool looks for the key file by this exact name under one of
          # a handful of well-known directories - ~/private_keys is one of them.
          mkdir -p "$HOME/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            -t ios \
            -f "build/${{ steps.meta.outputs.version }}/freqhole_charnel_${{ steps.meta.outputs.version }}_ios.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

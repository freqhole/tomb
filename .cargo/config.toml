# Cargo configuration for the axum_tutorial project
# This file sets project-specific cargo settings

[env]
# Use SQLx offline mode by default for compilation
# This avoids needing a database connection during builds
# Override with SQLX_OFFLINE=false when you want online mode
# SQLX_OFFLINE = "true"

# DATABASE_URL for online sqlx compile checks is computed by grimoire's own
# build.rs (from CARGO_MANIFEST_DIR, absolute and cwd-independent) - not set
# here anymore, since a plain relative path only resolved correctly when
# cargo was invoked from this exact directory.

[build]
# Number of parallel jobs, defaults to # of CPUs
# jobs = 1

[target.x86_64-unknown-linux-gnu]
# Linux-specific settings if needed

[target.aarch64-apple-darwin]
# libmpv2-sys emits a bare `-lmpv` with no search path (see
# docs/libmpv-experimental-player-plan.md); homebrew's ARM prefix isn't a
# default linker search dir, so add it explicitly. /usr/local/lib is a
# second search path for CI/release builds, which stage a portable
# mpv-libre-runtime build there instead (see scripts/fetch-mpv-runtime.sh) -
# local dev keeps working unchanged via the homebrew path above.
rustflags = ["-L", "/opt/homebrew/lib", "-L", "/usr/local/lib"]

[target.x86_64-apple-darwin]
# homebrew dropped Intel macOS bottle support entirely (~September 2026)
# but building mpv from source still works fine - scripts/fetch-mpv-
# runtime.sh's x86_64 branch bootstraps its own relocatable homebrew
# prefix at /Users/Shared/freqhole-homebrew-x86 (a FIXED path, not
# per-user $HOME - this file is static TOML with no shell/env expansion,
# so the path baked in here and the one the script bootstraps must be
# identical literal strings) and builds mpv there. linked as a normal
# hard dependency (`-lmpv`, not weak) and bundled into the app exactly
# like the arm64 target - see that script's top-of-file doc comment for
# why this used to be weakly-linked-and-optional instead (short version:
# a misdiagnosed "broken GPU renderer" that was actually macOS hardened
# runtime blocking MoltenVK, long since fixed via entitlements).
rustflags = ["-L", "/Users/Shared/freqhole-homebrew-x86/opt/mpv/lib"]

# Raspberry Pi targets
[target.armv7-unknown-linux-gnueabihf]
# Raspberry Pi 2, 3, 4 (32-bit)
linker = "armv7-linux-gnueabihf-gcc"

[target.aarch64-unknown-linux-gnu]
# Raspberry Pi 3, 4, 5 (64-bit)
linker = "aarch64-linux-gnu-gcc"

# You can override SQLX_OFFLINE in your editor by setting it to false
# For example, in VS Code settings.json:
# "rust-analyzer.cargo.extraEnv": {
#   "SQLX_OFFLINE": "false"
# }

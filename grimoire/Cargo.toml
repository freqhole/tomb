[package]
name = "grimoire"
version.workspace = true
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
sqlx = { workspace = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "time",
    "json",
    "migrate",
] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
async-trait = { workspace = true }
tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true, features = ["sqlite"] }
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
lofty = { workspace = true }
walkdir = { workspace = true }
image = { workspace = true }
mime_guess = { workspace = true }
tracing = { workspace = true }
bigdecimal = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
shell-words = { workspace = true }
csv = "1.3"
urlencoding = "2.1"
once_cell = "1.19"
toml = "0.8"
toml_edit = "0.22"
unicode-normalization = "0.1"
dirs = "5"
which = "7"
include_dir = "0.7"
dialoguer = "0.11"
iroh = { workspace = true }
iroh-blobs = { workspace = true }
blake3 = { workspace = true }
bytes = "1.10"
getrandom = "0.2"
haruspex = { path = "../lib/haruspex/rust" }
reliquary = { path = "../lib/reliquary/rust", default-features = false, features = [
    "blobz",
    "node",
    "chunked_import",
    "gate",
] }

clap = { version = "4.4", features = ["derive"] }
humantime = "2.1"
sea-query = { version = "0.30", features = ["backend-sqlite", "thread-safe"] }
sea-query-sqlx = { version = "0.8.0-rc.11", features = ["sqlx-sqlite"] }

tracing-subscriber = "0.3"

# libmpv audio backend (see docs/libmpv-experimental-player-plan.md) -
# same crate charnel's video window uses, in-process, no subprocess.
# optional/gated so headless/cross-compile targets without system
# libmpv at link time can omit it.
libmpv2 = { version = "6", optional = true }
# raw FFI types (mpv_node/mpv_node_list) - libmpv2's safe `GetData` trait
# has no typed getter for MPV_FORMAT_NODE properties (e.g.
# `audio-device-list`) yet, so we implement our own against these directly.
libmpv2-sys = { version = "4.0.1", optional = true }
# mpv_create() returns NULL if LC_NUMERIC isn't "C" - GTK/tao's own
# setlocale(LC_ALL, "") during window init can leave it as whatever the
# user's locale is, so we reset it ourselves right before creating an
# Mpv instance.
libc = "0.2"

# api codegen support
zod_gen = "1.0"
zod_gen_derive = "1.0"


[features]
default = ["webauthn", "libmpv-playback"]
webauthn = ["webauthn-rs", "haruspex/webauthn"]
# lan discovery over mdns/dns-sd for the federation endpoint (see
# haruspex's `augur` module). off by default, same as haruspex's own
# augur feature - pulls in real per-platform networking deps.
augur = ["haruspex/augur"]
vendored-openssl = ["openssl"]
# libmpv audio backend. disable for headless / cross-compile targets
# without system libmpv available at link time.
libmpv-playback = ["dep:libmpv2", "dep:libmpv2-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
udev = "0.9.3"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"
objc2-core-foundation = "0.3.2"
objc2-disk-arbitration = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Ioctl",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# libmpv2-sys ships one pregenerated bindings.rs (no per-arch variants),
# whose bindgen-emitted static layout assertions (`size_of::<T>() -
# <N>usize`) were generated against a 64-bit pointer width - wrong (and a
# straight-up `error[E0080]: ... which would overflow` compile error, not
# just a runtime bug) on any 32-bit target, confirmed for real 2026-10-03
# cross-compiling pi32 (armv7). regenerate bindings live instead, against
# the real target's layout, via its own `use-bindgen` feature (needs
# libclang-dev - see Dockerfile.build's armv7 branch).
[target.'cfg(target_arch = "arm")'.dependencies]
libmpv2-sys = { version = "4.0.1", optional = true, features = ["use-bindgen"] }

[dependencies.webauthn-rs]
workspace = true
optional = true

[dependencies.openssl]
workspace = true
optional = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# webauthn credential-compatibility test's minimal software authenticator:
# real p-256 keygen, sha-256 hashing, and ecdsa signing - the same crate
# webauthn-rs itself already links transitively, so this adds no new
# native dependency.
openssl = { workspace = true }
